name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['^4.0', '^5.0']
        testbench: ['^10.0']
        include:
          # Filament v4 also supports Laravel 11 (testbench ^9); v5 requires Laravel 12.
          - php: '8.3'
            filament: '^4.0'
            testbench: '^9.0'
          # Lowest supported stack: catches signature drift in the Filament
          # internals the traits couple to before it reaches published users.
          - php: '8.2'
            filament: '^4.0'
            testbench: '^9.0'
            prefer: 'lowest'

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - Testbench ${{ matrix.testbench }}${{ matrix.prefer == 'lowest' && ' - lowest' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction ${{ matrix.prefer == 'lowest' && '--prefer-lowest' || '' }}

      - name: Run tests
        run: vendor/bin/pest
