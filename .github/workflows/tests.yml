name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['^4.0', '^5.0']
        testbench: ['^10.0']
        include:
          # Laravel 13
          - php: '8.4'
            filament: '^4.0'
            testbench: '^11.0'
          - php: '8.4'
            filament: '^5.0'
            testbench: '^11.0'
          # Oldest supported Filament: catches signature drift.
          - php: '8.2'
            filament: '^4.0'
            testbench: '^10.0'
            prefer: 'lowest'

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - Testbench ${{ matrix.testbench }}${{ matrix.prefer == 'lowest' && ' - lowest' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Old releases carry advisories fixed later, which Composer 2.9+ blocks.
      - name: Allow superseded releases on the lowest leg
        if: matrix.prefer == 'lowest'
        run: composer config policy.advisories.block false || true

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction ${{ matrix.prefer == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/pest
