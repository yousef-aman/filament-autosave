version: 2

updates:
  # Only Actions: this is a library, so composer.json carries deliberately wide
  # constraints and no lockfile for an updater to maintain.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A malicious release is most dangerous in the hours after it lands.
    # The semver-*-days keys are rejected for this ecosystem: Dependabot tracks
    # Actions by ref, not by semver.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
